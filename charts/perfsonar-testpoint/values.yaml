replicaCount: 1

image:
  repository: perfsonar/testpoint
  pullPolicy: IfNotPresent
  tag: "v5.2.4"

imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

service:
  default:
    type: LoadBalancer
    enabled: true
    annotations: {}
  # -- ClusterIP service with ClusterIP: none so that it resolves to the Pod IP address
  headless:
    enabled: true
    annotations: {}

# -- Multus CNI deployment mode. When enabled, no Services are created (neither
# service-headless nor service-loadbalancer) and the Multus network annotation
# is added to the pod. Requires multus.networks to be set.
multus:
  enabled: false
  # -- Value for the k8s.v1.cni.cncf.io/networks annotation.
  # Can be a simple NAD name ("my-network") or a JSON array
  # ('[{"name": "my-network", "interface": "net1"}]')
  networks: ""

# -- Host network mode. When enabled, the pod binds directly to the node's network interface.
# Recommended: set service.default.enabled=false when using this mode, as port exposure is
# already handled by the host network. Only one replica should run per node to avoid
# port binding conflicts.
hostNetwork:
  enabled: false

# -- Optional ConfigMap mount for /etc/perfsonar/psconfig/pscheduler.d
# enabled=false: nothing is mounted.
# enabled=true with no data: the ConfigMap is mounted and expected to exist already.
# any non-empty data: the ConfigMap is created from the provided data.
# enabled=true with data: the created ConfigMap is also mounted.
pschedulerConfigMap:
  enabled: false
  # -- Defaults to {{ $.Release.Name }}-pscheduler-d-configmap if not set
  # name: existing-pscheduler-d-configmap
  # data:
  #   pscheduler.json: |
  #     {}

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: "default"

podAnnotations: {}
podLabels:
  shell-access-enabled: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
   limits:
     memory: 4096Mi
   requests:
     cpu: 500m
     memory: 2048Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
#livenessProbe:
#  httpGet:
#    path: /
#    port: http
#readinessProbe:
#  httpGet:
#    path: /
#    port: http

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  storageClass: "-"
  size: 3Gi
  accessMode: ReadWriteOnce
